<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a31">
  <title>아정당 매장 실적 현황</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17233c; --muted: #78849b; --line: #dce5f1; --paper: #f5f8fc;
      --blue: #625cf0; --blue2: #3881f3; --teal: #12b89a; --orange: #ff861b;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      color: var(--ink); background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); }
    .topline { height: 5px; background: #101a31; }
    .nav { min-height: 42px; display: flex; align-items: stretch; justify-content: space-between; gap: 12px; padding: 0 20px; background: #fff; border-bottom: 1px solid var(--line); }
    .nav-tabs, .filters { display: flex; align-items: center; gap: 6px; }
    .nav-tab { padding: 0 13px; display: inline-flex; align-items: center; gap: 6px; color: #64708a; text-decoration: none; font-size: 11px; font-weight: 650; border-bottom: 2px solid transparent; }
    .nav-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .filters { font-size: 11px; color: #65728a; }
    select, button { font: inherit; }
    select { color: #24314d; border: 1px solid #d5deeb; border-radius: 7px; background: #fff; padding: 6px 9px; font-size: 11px; }
    button { cursor: pointer; }
    .store-pill { border: 1px solid #cad7ff; border-radius: 20px; color: #514dec; background: #f5f6ff; padding: 6px 11px; font-size: 10px; white-space: nowrap; }
    main { max-width: 1240px; margin: 0 auto; padding: 16px 18px 34px; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 14px; }
    .metric { min-height: 66px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 6px #20385c08; }
    .metric-label { font-size: 10px; color: #66748c; margin-bottom: 4px; }
    .metric-value { font-size: 20px; line-height: 1.15; font-weight: 760; color: #18233c; }
    .metric-value.blue { color: var(--blue); } .metric-value.green { color: #07866c; } .metric-value.orange { color: #e77a00; }
    .metric-unit { font-size: 10px; font-weight: 550; margin-left: 3px; color: #6e7c94; }
    .metric-icon { width: 33px; height: 33px; display: grid; place-items: center; border-radius: 11px; background: #f0f1ff; color: var(--blue); font-size: 16px; flex: 0 0 auto; }
    .metric-icon.green { background: #e9fbf5; color: #00a57f; } .metric-icon.orange { background: #fff7e8; color: #ed8500; }
    .section { margin-bottom: 14px; padding: 15px 16px 16px; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 2px 6px #20385c08; scroll-margin-top: 12px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 26px; padding-bottom: 10px; margin-bottom: 13px; border-bottom: 1px solid #e8eef6; }
    .section-title { margin: 0; font-size: 12px; font-weight: 750; }
    .section-note { margin-left: 5px; color: #8a96aa; font-size: 9px; font-weight: 450; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .chart-card { min-width: 0; padding: 12px; border: 1px solid #dce5f1; border-radius: 10px; background: #f8fafc; }
    .chart-title { margin: 0 0 5px; text-align: center; color: #36445f; font-size: 10px; font-weight: 700; }
    .chart-wrap { height: 205px; position: relative; }
    .rank-controls { display: flex; align-items: center; gap: 4px; padding: 3px; border: 1px solid #e0e7f1; border-radius: 9px; background: #f8fafd; }
    .rank-button { padding: 5px 8px; border: 0; border-radius: 6px; color: #68758d; background: transparent; font-size: 9px; white-space: nowrap; }
    .rank-button.active { color: #514dec; background: #fff; box-shadow: 0 1px 4px #21314a18; font-weight: 700; }
    .ranking-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(220px, .9fr); gap: 18px; align-items: center; }
    .rank-chart-wrap { height: 205px; }
    .rank-list { display: grid; gap: 7px; padding: 10px; border: 1px solid #dce5f1; border-radius: 10px; background: #f8fafc; }
    .rank-item { display: grid; grid-template-columns: 25px 1fr auto auto; align-items: center; gap: 7px; padding: 7px 8px; background: #fff; border: 1px solid #e6ebf3; border-radius: 7px; font-size: 10px; }
    .rank-badge { width: 20px; text-align: center; padding: 3px 0; border-radius: 5px; color: #fff; background: #9aa8bd; font-weight: 750; }
    .rank-item:nth-child(1) .rank-badge { background: #ff9a00; } .rank-item:nth-child(2) .rank-badge { background: #8d9db5; } .rank-item:nth-child(3) .rank-badge { background: #ef8d45; }
    .rank-name { font-weight: 700; color: #283650; }
    .rank-main { color: #07866c; font-weight: 750; font-variant-numeric: tabular-nums; }
    .rank-sub { color: #8591a5; font-size: 9px; white-space: nowrap; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 620px; }
    th, td { padding: 9px 11px; border-bottom: 1px solid #edf1f6; text-align: left; white-space: nowrap; font-size: 10px; }
    th { color: #758198; background: #f8fafc; font-size: 9px; font-weight: 700; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:last-child td { border-bottom: 0; }
    .status { padding: 9px 2px 0; color: #7e8ba0; font-size: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 18px; font-size: 11px; }
    .error { margin: 10px 0; color: #a93333; background: #fff1f0; border: 1px solid #ffd3cf; border-radius: 8px; padding: 10px; font-size: 11px; }
    @media (max-width: 760px) {
      .nav { padding: 0 9px; flex-wrap: wrap; } .nav-tabs { overflow-x: auto; min-height: 40px; } .nav-tab { padding: 0 8px; white-space: nowrap; }
      .filters { padding: 0 0 8px; margin-left: auto; } main { padding: 12px 10px 24px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .metric { min-height: 61px; padding: 10px; } .metric-value { font-size: 17px; }
      .charts, .ranking-layout { grid-template-columns: 1fr; } .chart-wrap { height: 190px; }
      .rank-chart-wrap { height: 190px; } .section { padding: 12px 11px; }
      .section-heading { align-items: flex-start; flex-wrap: wrap; }
    }
    @media (max-width: 420px) { .rank-button { padding: 5px 5px; font-size: 8px; } .rank-list { padding: 7px; } }
  </style>
</head>
<body>
<div class="topline"></div>
<nav class="nav" aria-label="대시보드 메뉴">
  <div class="nav-tabs">
    <a class="nav-tab active" href="#overview">📊 매장별 실적 현황</a>
    <a class="nav-tab" href="#ranking">👤 개인별 실적 현황</a>
    <a class="nav-tab" href="#contracts">📋 내 계약 목록</a>
  </div>
  <div class="filters"><label for="monthFilter">🗓 월</label><select id="monthFilter" aria-label="월 선택"><option value="all">전체 기간</option></select><span class="store-pill">📍 전체 담당자 (고정)</span></div>
</nav>
<main>
  <div id="loadError" class="error" hidden></div>
  <section class="summary" id="overview">
    <article class="metric"><div><div class="metric-label" id="countLabel">전체 건수</div><div class="metric-value blue"><span id="count">-</span><span class="metric-unit">건</span></div></div><div class="metric-icon">▣</div></article>
    <article class="metric"><div><div class="metric-label" id="marginLabel">전체 마진</div><div class="metric-value"><span id="totalMargin">-</span><span class="metric-unit">원</span></div></div><div class="metric-icon green">₩</div></article>
    <article class="metric"><div><div class="metric-label">건당 평균 마진</div><div class="metric-value green"><span id="average">-</span><span class="metric-unit">원</span></div></div><div class="metric-icon orange">⌁</div></article>
    <article class="metric"><div><div class="metric-label">목표 달성률</div><div class="metric-value orange"><span id="rate">-</span></div></div><div class="metric-icon orange">％</div></article>
    <article class="metric"><div><div class="metric-label">목표 금액</div><div class="metric-value"><span id="goal">-</span><span class="metric-unit">원</span></div></div><div class="metric-icon">◎</div></article>
    <article class="metric"><div><div class="metric-label">부가 · 모바일 기준</div><div class="metric-value"><span id="addon">-</span></div></div><div class="metric-icon green">＋</div></article>
    <article class="metric"><div><div class="metric-label">모동 · 모바일 기준</div><div class="metric-value"><span id="mobileDong">-</span></div></div><div class="metric-icon orange">◉</div></article>
  </section>

  <section class="section">
    <div class="section-heading"><h2 class="section-title">📍 <span id="periodTitle">전체 기간</span> 실적 분석</h2></div>
    <div class="charts">
      <article class="chart-card"><h3 class="chart-title">◕ 계약 유형별 매출 비중</h3><div class="chart-wrap"><canvas id="typeChart"></canvas></div></article>
      <article class="chart-card"><h3 class="chart-title">▧ 직원별 마진 기여도</h3><div class="chart-wrap"><canvas id="personChart"></canvas></div></article>
    </div>
  </section>

  <section class="section" id="ranking">
    <div class="section-heading">
      <h2 class="section-title">🏆 직원별 순위 랭킹 <span class="section-note">선택 기준으로 높은 순서 정렬</span></h2>
      <div class="rank-controls" role="group" aria-label="순위 기준">
        <button class="rank-button active" data-rank="average">🏅 평균 마진 순위</button>
        <button class="rank-button" data-rank="count">🥇 건수 순위</button>
        <button class="rank-button" data-rank="total">💰 총 매출 순위</button>
      </div>
    </div>
    <div class="ranking-layout">
      <div class="rank-chart-wrap"><canvas id="rankChart"></canvas></div>
      <div class="rank-list" id="rankList"></div>
    </div>
  </section>

  <section class="section" id="contracts">
    <div class="section-heading"><h2 class="section-title">📋 전체 계약 목록</h2><span class="section-note" id="contractCount"></span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>날짜</th><th>담당자</th><th>계약번호</th><th>유형</th><th>부가</th><th>모동</th><th class="num">마진 금액</th></tr></thead>
      <tbody id="orderRows"></tbody>
    </table></div>
    <div class="status" id="status">스프레드시트 데이터 불러오는 중…</div>
  </section>
</main>
<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTHjYdKL-DbXDzp19ukPoJwYJgDYcayWc2wJG4Ho23uReMI3uBAHAgD7PfhaOFdj0it2R88XDF5pEqk/pub?output=csv";
  const PERSON_TARGET = 15000000;
  // 새 시트의 반복 블록: 계약번호, 유형, 부가, 모동, 금액 (B-F, G-K, L-P)
  const BLOCK_STARTS = [1, 6, 11];
  const TYPE_COLORS = { "인터넷": "#625cf0", "모바일": "#3881f3", "알뜰": "#12b89a", "유심": "#ff9b18", "렌탈": "#ef5d91", "기타": "#8e78e8", "미분류": "#aab5c5" };
  const TYPE_ORDER = ["인터넷", "모바일", "알뜰", "유심", "렌탈", "기타", "미분류"];
  let allData = { people: [], orders: [] };
  let typeChart, personChart, rankChart;
  let rankMode = "average";

  function parseCSV(text) {
    const result = []; let row = [], cell = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"' && quoted && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') quoted = !quoted;
      else if (c === "," && !quoted) { row.push(cell); cell = ""; }
      else if ((c === "\n" || c === "\r") && !quoted) {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); result.push(row); row = []; cell = "";
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); result.push(row); }
    return result.map(r => r.map(v => v.trim()));
  }
  function amount(value) {
    const n = Number(String(value ?? "").replace(/[^\d.-]/g, ""));
    return Number.isFinite(n) ? n : 0;
  }
  function normalizeType(value) {
    const type = String(value || "").trim().replace(/\s/g, "");
    if (/^모바일|^모발/.test(type)) return "모바일";
    if (/^인터넷/.test(type)) return "인터넷";
    if (/^알뜰/.test(type)) return "알뜰";
    if (/^유심/.test(type)) return "유심";
    if (/^렌탈/.test(type)) return "렌탈";
    return type ? "기타" : "미분류";
  }
  function marked(value) {
    return ["o", "○", "ㅇ", "yes", "y", "1", "✓", "✔"].includes(String(value || "").trim().toLowerCase());
  }
  function monthFromOrder(id, date) {
    const idMatch = String(id).match(/^AJ[DO](\d{4})(\d{2})\d{2}/i);
    if (idMatch) return `${idMatch[1]}-${idMatch[2]}`;
    const text = String(date || "");
    const m = text.match(/(20\d{2})[./年 -]?(\d{1,2})/);
    if (m) return `${m[1]}-${String(m[2]).padStart(2, "0")}`;
    return "미분류";
  }
  function parseSheet(csv) {
    const rows = parseCSV(csv);
    const people = BLOCK_STARTS.map(start => String(rows[1]?.[start] || "").trim()).filter(Boolean);
    const orders = []; let currentDate = "";
    for (const row of rows.slice(2)) {
      if (row[0]) currentDate = row[0];
      BLOCK_STARTS.forEach((start, i) => {
        const id = String(row[start] || "").trim();
        if (/^AJ[DO]\d+/i.test(id)) {
          const date = currentDate || "날짜 미지정";
          orders.push({ date, month: monthFromOrder(id, date), person: people[i] || `담당자 ${i + 1}`, id,
            type: normalizeType(row[start + 1]), addon: marked(row[start + 2]), mobileDong: marked(row[start + 3]), amount: amount(row[start + 4]) });
        }
      });
    }
    return { people, orders };
  }
  const won = n => Math.round(n).toLocaleString("ko-KR");
  const percent = (n, denominator) => denominator ? `${(n / denominator * 100).toFixed(1)}%` : "0.0%";
  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function monthLabel(month) {
    if (!month || month === "all") return "전체 기간";
    const [year, m] = month.split("-");
    return `${year}년 ${Number(m)}월`;
  }
  function selectedOrders() {
    const month = document.getElementById("monthFilter").value;
    return month === "all" ? allData.orders : allData.orders.filter(x => x.month === month);
  }
  function statsFor(orders) {
    return allData.people.map(person => {
      const own = orders.filter(x => x.person === person);
      const total = own.reduce((s, x) => s + x.amount, 0);
      return { person, count: own.length, total, average: own.length ? total / own.length : 0 };
    });
  }
  function sortedStats(stats, key) {
    return [...stats].sort((a, b) => b[key] - a[key] || a.person.localeCompare(b.person, "ko"));
  }
  function render() {
    const orders = selectedOrders();
    const total = orders.reduce((s, x) => s + x.amount, 0);
    const count = orders.length;
    const target = allData.people.length * PERSON_TARGET;
    const mobiles = orders.filter(x => x.type === "모바일");
    const addonCount = mobiles.filter(x => x.addon).length;
    const mobileDongCount = mobiles.filter(x => x.mobileDong).length;
    const month = document.getElementById("monthFilter").value;
    document.getElementById("periodTitle").textContent = monthLabel(month);
    document.getElementById("countLabel").textContent = `${monthLabel(month)} 건수`;
    document.getElementById("marginLabel").textContent = `${monthLabel(month)} 총 마진`;
    document.getElementById("count").textContent = count.toLocaleString("ko-KR");
    document.getElementById("totalMargin").textContent = won(total);
    document.getElementById("average").textContent = won(count ? total / count : 0);
    document.getElementById("rate").textContent = target ? `${(total / target * 100).toFixed(1)}%` : "-";
    document.getElementById("goal").textContent = won(target);
    document.getElementById("addon").textContent = `${addonCount}건 · ${percent(addonCount, mobiles.length)}`;
    document.getElementById("mobileDong").textContent = `${mobileDongCount}건 · ${percent(mobileDongCount, mobiles.length)}`;

    const typeCounts = new Map();
    orders.forEach(x => typeCounts.set(x.type, (typeCounts.get(x.type) || 0) + 1));
    const typeKeys = [...TYPE_ORDER.filter(t => typeCounts.has(t)), ...[...typeCounts.keys()].filter(t => !TYPE_ORDER.includes(t))];
    if (typeChart) typeChart.destroy();
    typeChart = new Chart(document.getElementById("typeChart"), {
      type: "doughnut", data: { labels: typeKeys, datasets: [{ data: typeKeys.map(t => typeCounts.get(t)), backgroundColor: typeKeys.map(t => TYPE_COLORS[t] || "#8e78e8"), borderWidth: 2, borderColor: "#f8fafc" }] },
      options: { maintainAspectRatio: false, cutout: "47%", plugins: { legend: { position: "bottom", labels: { boxWidth: 7, boxHeight: 7, padding: 9, font: { size: 9 } } }, tooltip: { callbacks: { label: c => ` ${c.label}: ${c.raw}건 (${percent(c.raw, count)})` } } } }
    });
    const stats = statsFor(orders);
    if (personChart) personChart.destroy();
    personChart = new Chart(document.getElementById("personChart"), {
      type: "pie", data: { labels: stats.map(x => x.person), datasets: [{ data: stats.map(x => x.total), backgroundColor: ["#625cf0", "#12b8cf", "#ff861b", "#12b89a", "#ed5d91"], borderWidth: 2, borderColor: "#f8fafc" }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 7, boxHeight: 7, padding: 9, font: { size: 9 } } }, tooltip: { callbacks: { label: c => ` ${c.label}: ${won(c.raw)}원 (${percent(c.raw, total)})` } } } }
    });
    renderRanking(stats);
    document.getElementById("orderRows").innerHTML = orders.length ? [...orders].reverse().map(x =>
      `<tr><td>${escapeHTML(x.date)}</td><td>${escapeHTML(x.person)}</td><td>${escapeHTML(x.id)}</td><td>${escapeHTML(x.type)}</td><td>${x.addon ? "O" : "—"}</td><td>${x.mobileDong ? "O" : "—"}</td><td class="num">${won(x.amount)}원</td></tr>`
    ).join("") : '<tr><td colspan="7" class="empty">선택한 기간에 계약 내역이 없습니다.</td></tr>';
    document.getElementById("contractCount").textContent = `${count.toLocaleString("ko-KR")}건`;
    document.getElementById("status").textContent = `총 ${count.toLocaleString("ko-KR")}건 · 총 마진 ${won(total)}원 · 건당 평균 ${won(count ? total / count : 0)}원 · 부가/모동 비율은 모바일 ${mobiles.length}건 기준`;
  }
  function renderRanking(stats) {
    const labels = { average: "건당 평균 마진", count: "계약 건수", total: "총 마진" };
    const ranked = sortedStats(stats, rankMode);
    const rankValues = ranked.map(x => x[rankMode]);
    if (rankChart) rankChart.destroy();
    rankChart = new Chart(document.getElementById("rankChart"), {
      type: "bar", data: { labels: ranked.map(x => x.person), datasets: [{ label: labels[rankMode], data: rankValues, backgroundColor: ["#625cf0", "#3881f3", "#12b89a", "#ff9b18"], borderRadius: 5, barThickness: 26 }] },
      options: { indexAxis: "y", maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => rankMode === "count" ? ` ${c.raw}건` : ` ${won(c.raw)}원` } } }, scales: { x: { beginAtZero: true, ticks: { font: { size: 8 }, callback: v => rankMode === "count" ? `${v}건` : `${Math.round(v / 10000)}만` }, grid: { color: "#e8edf4" } }, y: { ticks: { font: { size: 9 } }, grid: { display: false } } } }
    });
    document.getElementById("rankList").innerHTML = ranked.map((x, i) => {
      const main = rankMode === "count" ? `${x.count}건` : `${won(x[rankMode])}원`;
      const sub = rankMode === "count" ? `${won(x.total)}원 · 총마진` : `${x.count}건 · 평균 ${won(x.average)}원`;
      return `<div class="rank-item"><span class="rank-badge">${i + 1}위</span><span class="rank-name">${escapeHTML(x.person)}</span><span class="rank-main">${main}</span><span class="rank-sub">${sub}</span></div>`;
    }).join("") || '<div class="empty">표시할 담당자 데이터가 없습니다.</div>';
  }
  function setupMonthFilter() {
    const select = document.getElementById("monthFilter");
    const months = [...new Set(allData.orders.map(x => x.month).filter(x => x && x !== "미분류"))].sort().reverse();
    select.innerHTML = '<option value="all">전체 기간</option>' + months.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join("");
    if (months.length) select.value = months[0];
    select.addEventListener("change", render);
  }
  async function loadData() {
    const errorBox = document.getElementById("loadError");
    errorBox.hidden = true;
    document.getElementById("updated").textContent = "스프레드시트 데이터 불러오는 중…";
    try {
      const response = await fetch(CSV_URL, { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      allData = parseSheet(await response.text());
      if (!allData.orders.length) throw new Error("주문 행을 찾지 못했습니다. 공개 CSV와 블록 열 배치를 확인해주세요.");
      setupMonthFilter();
      document.getElementById("updated").textContent = `공개 게시 스프레드시트 · ${new Date().toLocaleString("ko-KR")}`;
      render();
    } catch (error) {
      errorBox.hidden = false;
      errorBox.textContent = `시트 데이터를 불러오지 못했습니다: ${error.message}`;
      document.getElementById("status").textContent = "데이터 연결에 실패했습니다. 시트 공개 설정과 CSV 주소를 확인해주세요.";
      document.getElementById("updated").textContent = "연결 오류";
    }
  }
  document.getElementById("refreshButton").addEventListener("click", loadData);
  document.querySelectorAll(".rank-button").forEach(button => button.addEventListener("click", () => {
    document.querySelectorAll(".rank-button").forEach(x => x.classList.toggle("active", x === button));
    rankMode = button.dataset.rank;
    if (allData.orders.length) render();
  }));
  document.querySelectorAll(".nav-tab").forEach(tab => tab.addEventListener("click", () => {
    document.querySelectorAll(".nav-tab").forEach(x => x.classList.toggle("active", x === tab));
  }));
  document.getElementById("refreshButton").textContent = "↻ 새로고침";
  document.getElementById("updated").textContent = "공개 게시 스프레드시트 연결 대기 중";
  loadData();
</script>
</body>
</html>
